version: 2
updates:
    - package-ecosystem: cargo
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          rust-deps:
              patterns:
                  - "*"
    - package-ecosystem: npm
      directory: "/fe"
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      ignore:
          # TypeScript 7 (native Go compiler) drops the JS `ts.factory` compiler
          # API that openapi-typescript, vue-tsc and typescript-eslint call.
          # Revisit once those tools support TS 7.
          - dependency-name: typescript
            update-types: ["version-update:semver-major"]
      groups:
          fe-deps:
              patterns:
                  - "*"
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: monthly
