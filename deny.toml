[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0459 — C SQLite CVE in `libsqlite3-sys` 0.37. Only listed in
    # Cargo.lock as an optional dep of `sqlx-sqlite` (via sqlx-macros-core);
    # we enable the `postgres` driver only, so it is never compiled. Drop
    # once sqlx ships with libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
    # RUSTSEC-2026-0374 — `basic-toml` unmaintained. Build-time only: askama's
    # derive macro reads `askama.toml` with it; nothing reaches the binary at
    # runtime. askama 0.16.1 is the latest release; revisit on the next one.
    "RUSTSEC-2026-0374",
    # RUSTSEC-2026-0440 — `astral-tokio-tar` unmaintained. Dev-dependency only
    # (testcontainers 0.27). testcontainers-modules 0.15 (latest) still pins
    # testcontainers 0.27; revisit when it moves to 0.28.
    "RUSTSEC-2026-0440",
]

[licenses]
# BUSL-1.1 is our own workspace licence; the rest are third-party deps.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
    "BUSL-1.1",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
# Duplicate transitive versions are inevitable while ed25519-dalek 2.x pins
# rand_core 0.6 — bumping rand to 0.9 introduces a second rand_core, and
# windows-sys / hashbrown / sha2 / etc. all spread across versions through
# the ecosystem. None of these are security or correctness concerns. Promote
# back to "warn" once we're on ed25519-dalek 3.x and can dedupe.
multiple-versions = "allow"
wildcards = "deny"
# Our workspace crates use `path = "..."` with no `version = "..."` field.
# Cargo treats those as wildcard deps. Allow only path-based wildcards so
# external `crate = "*"` still trips the check.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
