[workspace]
resolver = "2"
members = [
  "crates/config",
  "crates/domain",
  "crates/cache",
  "crates/email",
  "crates/persistence",
  "crates/openapi",
  "crates/migrator",
  "crates/storage",
  "crates/worker",
  "crates/api",
  "crates/seeder",
]

[workspace.package]
# Single source of truth for every crate's version (each crate uses
# `version.workspace = true`). release-please bumps the line below on release
# via the x-release-please-version marker, so env!("CARGO_PKG_VERSION") — and
# the /api/v1/health version — track the released version.
version = "0.1.22" # x-release-please-version
edition = "2024"
rust-version = "1.83"
license = "BUSL-1.1"
authors = ["my-fam-tree contributors"]
repository = "https://github.com/BentBr/my-fam-tree"
description = "A family tree to organise families and share insights of heredity"

[workspace.dependencies]
# No default features: drops `http2` (h2 0.3, RUSTSEC-2026-0258) and the
# `compress-*` codecs. The API sits behind nginx speaking HTTP/1.1 and uses
# no `Compress` middleware.
actix-web = { version = "4.19", default-features = false, features = ["macros", "cookies", "unicode", "compat"] }
actix-cors = "0.7.1"
# Multipart upload parser used by the photo + avatar endpoints. 0.7 lines up
# with actix-web 4.
actix-multipart = "0.7"
anyhow = "1.0"
askama = "0.16"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client"] }
# `default_async_sleep` for the SDK's retry runtime. aws-config pulls
# `rt-tokio` in transitively; declaring the dep directly lets us name the
# helper without leaning on a private re-export.
aws-smithy-async = { version = "1", features = ["rt-tokio"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
deadpool-redis = "0.23"
dotenvy = "0.15"
# TODO bump: 3.0; latest stable is 2.2 (3.0 is pre-release/alpha as of 2026-05-20).
ed25519-dalek = { version = "2.2", features = ["pem", "rand_core"] }
envy = "0.4"
figment = { version = "0.10", features = ["env", "toml"] }
futures-util = "0.3"
# Image decode + resize for photo/avatar uploads. No SVG/HDR/TIFF — only the
# three formats we actually accept on the wire (JPEG / PNG / WebP) — and no
# default rayon to keep build times honest.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# `aws_lc_rs` backend (already in the tree via the AWS SDK's default HTTPS
# client). `rust_crypto` pulled in `rsa` 0.9 (RUSTSEC-2023-0071) and
# `crypto-bigint` 0.5 (RUSTSEC-2026-0387) for algorithms we never use.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
once_cell = "1"
# TODO bump: 0.10; pinned at 0.8 because ed25519-dalek 2.2 still uses rand_core 0.6.
rand = "0.8"
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "macros", "migrate", "ipnetwork", "json"] }
thiserror = "2"
url = "2.5"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

# Strict gate: `pedantic` + `nursery` at deny, all four big lint groups
# enforced. No targeted allows — every clippy finding gets fixed in
# source per Phase 2c spec (workstream D). If a specific lint is
# genuinely inappropriate later, add it back here with a one-line
# rationale rather than scattering `#[allow]` across files.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
float_arithmetic = "warn"
shadow_unrelated = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# `cargo test --workspace --all-targets` links ~15 integration test
# binaries each pulling in the full dependency graph (~250+ rlibs per
# binary at debug=2). On the GitHub Actions ubuntu-latest runner that
# blew the ~14 GB disk budget during link, surfacing as
# "No space left on device (os error 28)" mid-build. Dropping debug
# info from the dev/test profile keeps backtraces functional via
# `line-tables-only` (file:line is preserved, full DWARF expression
# evaluation is not — fine for CI; locally devs can override). Cuts
# per-binary size by ~5×.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Optimize DEPENDENCIES (only) at opt-level 2 in the unoptimized profiles.
# Our own crates stay at opt-level 0 so incremental rebuilds remain fast,
# but the runtime-heavy third-party code — sqlx + tokio-postgres (every
# query), tokio's reactor, serde (every request body), argon-free auth
# token SHA-256, etc. — runs near release speed. Without this the e2e
# stack's DEBUG api was pathologically slow under concurrent DB load
# (the big_family fixture's 50 parallel inserts + 45 SERIALIZABLE
# parent-link cycle-check txns took ~16 s, and a magic-link consume
# could queue behind it long enough to blow the signIn redirect budget —
# the recurring e2e flake). Dependencies are compiled once and cached
# (CI rust-cache + local target dir), so the one-time cost is amortized
# while every integration test and local run gets the faster runtime.
[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2
